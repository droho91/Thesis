<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Figure 3.1: High-Level Multi-Blockchain Lending Scenario</title>
  <desc id="desc">Portrait thesis diagram for a permissioned cross-chain lending prototype with Bank A as the source chain, a cross-chain proof and packet layer, and Bank B as the destination lending chain.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 24px Arial, Helvetica, sans-serif; fill: #111827; }
      .section-title { font: 700 17px Arial, Helvetica, sans-serif; fill: #1f2937; }
      .box-title { font: 700 14px Arial, Helvetica, sans-serif; fill: #111827; }
      .box-sub { font: 400 12px Arial, Helvetica, sans-serif; fill: #4b5563; }
      .label { font: 400 11px Arial, Helvetica, sans-serif; fill: #475569; }
      .section { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.4; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.25; }
      .actor { fill: #f9fafb; stroke: #111827; stroke-width: 1.35; }
      .source { fill: #f8fbff; stroke: #334155; stroke-width: 1.25; }
      .packet { fill: #fffdf7; stroke: #334155; stroke-width: 1.25; }
      .dest { fill: #fbfbff; stroke: #334155; stroke-width: 1.25; }
      .arrow { fill: none; stroke: #334155; stroke-width: 1.45; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 1.25; stroke-dasharray: 5 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="1120"/>

  <text class="title" x="400" y="44" text-anchor="middle">Figure 3.1: High-Level Multi-Blockchain Lending Scenario</text>

  <!-- Actors -->
  <rect class="actor" x="300" y="75" width="200" height="54" rx="7"/>
  <text class="box-title" x="400" y="98" text-anchor="middle">Borrower</text>
  <text class="box-sub" x="400" y="117" text-anchor="middle">locks and borrows</text>

  <!-- Bank A -->
  <rect class="section" x="65" y="155" width="670" height="250" rx="10"/>
  <text class="section-title" x="400" y="184" text-anchor="middle">Bank A - Source Chain</text>

  <rect class="box source" x="100" y="230" width="180" height="58" rx="6"/>
  <text class="box-title" x="190" y="254" text-anchor="middle">Canonical</text>
  <text class="box-title" x="190" y="272" text-anchor="middle">Collateral Token</text>

  <rect class="box source" x="310" y="230" width="180" height="58" rx="6"/>
  <text class="box-title" x="400" y="254" text-anchor="middle">Escrow Vault</text>
  <text class="box-sub" x="400" y="273" text-anchor="middle">canonical asset locked</text>

  <rect class="box source" x="310" y="325" width="180" height="58" rx="6"/>
  <text class="box-title" x="400" y="349" text-anchor="middle">Source Transfer App</text>
  <text class="box-sub" x="400" y="368" text-anchor="middle">commits transfer packet</text>

  <path class="arrow" d="M400 129 V145 H650 V259 H490"/>
  <text class="label" x="575" y="247">locks collateral</text>

  <line class="arrow" x1="280" y1="259" x2="310" y2="259"/>
  <text class="label" x="292" y="249" text-anchor="middle">feeds</text>

  <line class="arrow" x1="400" y1="288" x2="400" y2="325"/>
  <text class="label" x="415" y="311">escrow event</text>

  <!-- Cross-chain packet layer -->
  <rect class="section" x="65" y="435" width="670" height="280" rx="10"/>
  <text class="section-title" x="400" y="464" text-anchor="middle">Cross-Chain Proof and Packet Layer</text>

  <rect class="box packet" x="305" y="490" width="190" height="54" rx="6"/>
  <text class="box-title" x="400" y="513" text-anchor="middle">Packet Commitment</text>
  <text class="box-sub" x="400" y="531" text-anchor="middle">source-chain commitment</text>

  <rect class="box packet" x="305" y="580" width="190" height="54" rx="6"/>
  <text class="box-title" x="400" y="603" text-anchor="middle">Relayer / Demo Script</text>
  <text class="box-sub" x="400" y="621" text-anchor="middle">carries packet material</text>

  <rect class="box packet" x="305" y="650" width="190" height="54" rx="6"/>
  <text class="box-title" x="400" y="673" text-anchor="middle">Header + Proof</text>
  <text class="box-sub" x="400" y="691" text-anchor="middle">submitted to Bank B</text>

  <rect class="box packet" x="105" y="580" width="165" height="54" rx="6"/>
  <text class="box-title" x="188" y="603" text-anchor="middle">Receipt /</text>
  <text class="box-title" x="188" y="621" text-anchor="middle">Acknowledgement</text>

  <rect class="box packet" x="530" y="580" width="165" height="54" rx="6"/>
  <text class="box-title" x="613" y="603" text-anchor="middle">Timeout /</text>
  <text class="box-title" x="613" y="621" text-anchor="middle">Refund</text>

  <path class="arrow" d="M400 383 V420 H650 V517 H495"/>
  <text class="label" x="610" y="445">creates</text>

  <line class="arrow" x1="400" y1="544" x2="400" y2="580"/>
  <text class="label" x="415" y="566">packet</text>

  <line class="arrow" x1="400" y1="634" x2="400" y2="650"/>

  <line class="dash" x1="305" y1="607" x2="270" y2="607"/>
  <line class="dash" x1="495" y1="607" x2="530" y2="607"/>

  <!-- Bank B -->
  <rect class="section" x="65" y="735" width="670" height="360" rx="10"/>
  <text class="section-title" x="400" y="764" text-anchor="middle">Bank B - Destination Chain</text>

  <rect class="box dest" x="285" y="790" width="230" height="60" rx="6"/>
  <text class="box-title" x="400" y="814" text-anchor="middle">Proof Verification +</text>
  <text class="box-title" x="400" y="832" text-anchor="middle">Policy Checks</text>

  <rect class="box dest" x="285" y="885" width="230" height="60" rx="6"/>
  <text class="box-title" x="400" y="909" text-anchor="middle">Voucher Collateral Token</text>
  <text class="box-sub" x="400" y="928" text-anchor="middle">minted after checks</text>

  <rect class="box dest" x="285" y="980" width="230" height="60" rx="6"/>
  <text class="box-title" x="400" y="1004" text-anchor="middle">Lending Pool</text>
  <text class="box-sub" x="400" y="1023" text-anchor="middle">collateralized borrowing</text>

  <rect class="actor" x="95" y="885" width="165" height="54" rx="6"/>
  <text class="box-title" x="178" y="908" text-anchor="middle">Supplier</text>
  <text class="box-sub" x="178" y="927" text-anchor="middle">provides liquidity</text>

  <rect class="box dest" x="95" y="980" width="165" height="60" rx="6"/>
  <text class="box-title" x="178" y="1004" text-anchor="middle">Debt-Asset</text>
  <text class="box-title" x="178" y="1022" text-anchor="middle">Liquidity</text>

  <rect class="box dest" x="540" y="980" width="165" height="60" rx="6"/>
  <text class="box-title" x="623" y="1004" text-anchor="middle">Oracle +</text>
  <text class="box-title" x="623" y="1022" text-anchor="middle">Risk Controls</text>

  <rect class="box dest" x="285" y="1052" width="230" height="34" rx="6"/>
  <text class="box-title" x="400" y="1074" text-anchor="middle">Debt Asset to Borrower</text>

  <path class="arrow" d="M400 704 V725 H650 V820 H515"/>
  <text class="label" x="657" y="748">header and proof</text>

  <line class="arrow" x1="400" y1="850" x2="400" y2="885"/>
  <text class="label" x="415" y="873">successful checks</text>

  <line class="arrow" x1="400" y1="945" x2="400" y2="980"/>
  <text class="label" x="415" y="968">deposit collateral</text>

  <line class="arrow" x1="178" y1="939" x2="178" y2="980"/>
  <line class="arrow" x1="260" y1="1010" x2="285" y2="1010"/>

  <line class="dash" x1="540" y1="1010" x2="515" y2="1010"/>
  <text class="label" x="526" y="1000" text-anchor="middle">supports</text>

  <line class="arrow" x1="400" y1="1040" x2="400" y2="1052"/>
</svg>
