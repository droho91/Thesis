<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1180" viewBox="0 0 900 1180" role="img" aria-labelledby="title desc">
  <title id="title">Figure 4.2: Smart Contract Dependency Diagram</title>
  <desc id="desc">A portrait smart contract dependency diagram grouping policy, lending, application, gateway, checkpoint, and EVM proof contracts.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#334155"/>
    </marker>
    <style>
      .page { fill: #ffffff; }
      .title { font: 700 24px Arial, Helvetica, sans-serif; fill: #111827; }
      .group { fill: #f8fafc; stroke: #1f2937; stroke-width: 1.45; }
      .group-alt { fill: #fbfbfb; stroke: #1f2937; stroke-width: 1.45; }
      .group-title { font: 700 16.5px Arial, Helvetica, sans-serif; fill: #111827; }
      .contract { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
      .contract-soft { fill: #ffffff; stroke: #64748b; stroke-width: 1.1; }
      .contract-title { font: 700 13px Arial, Helvetica, sans-serif; fill: #111827; }
      .contract-note { font: 400 11.5px Arial, Helvetica, sans-serif; fill: #475569; }
      .edge { fill: none; stroke: #334155; stroke-width: 1.45; marker-end: url(#arrow); }
      .assoc { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5 5; marker-end: url(#arrow); }
      .edge-label { font: 400 11px Arial, Helvetica, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="900" height="1180"/>
  <text class="title" x="450" y="42" text-anchor="middle">Figure 4.2: Smart Contract Dependency Diagram</text>

  <!-- Policy / Oracle Contracts -->
  <rect class="group" x="70" y="78" width="760" height="145" rx="8"/>
  <text class="group-title" x="450" y="108" text-anchor="middle">Policy / Oracle Contracts</text>

  <rect class="contract" x="130" y="138" width="285" height="58" rx="6"/>
  <text class="contract-title" x="273" y="162" text-anchor="middle">BankPolicyEngine</text>
  <text class="contract-note" x="273" y="180" text-anchor="middle">permissions and exposure caps</text>

  <rect class="contract" x="485" y="138" width="285" height="58" rx="6"/>
  <text class="contract-title" x="628" y="162" text-anchor="middle">ManualAssetOracle</text>
  <text class="contract-note" x="628" y="180" text-anchor="middle">valuation input</text>

  <!-- Lending / Asset Contracts -->
  <rect class="group-alt" x="70" y="252" width="760" height="275" rx="8"/>
  <text class="group-title" x="450" y="282" text-anchor="middle">Lending / Asset Contracts</text>

  <rect class="contract" x="285" y="317" width="330" height="66" rx="6"/>
  <text class="contract-title" x="450" y="343" text-anchor="middle">PolicyControlledLendingPool</text>
  <text class="contract-note" x="450" y="363" text-anchor="middle">collateralized borrowing market</text>

  <rect class="contract" x="105" y="430" width="310" height="62" rx="6"/>
  <text class="contract-title" x="260" y="454" text-anchor="middle">PolicyControlledVoucherToken</text>
  <text class="contract-note" x="260" y="474" text-anchor="middle">voucher collateral asset</text>

  <rect class="contract" x="485" y="430" width="310" height="62" rx="6"/>
  <text class="contract-title" x="640" y="454" text-anchor="middle">PolicyControlledEscrowVault</text>
  <text class="contract-note" x="640" y="474" text-anchor="middle">canonical collateral custody</text>

  <!-- Application / Control Contracts -->
  <rect class="group" x="70" y="557" width="760" height="235" rx="8"/>
  <text class="group-title" x="450" y="587" text-anchor="middle">Application / Control Contracts</text>

  <rect class="contract" x="285" y="622" width="330" height="58" rx="6"/>
  <text class="contract-title" x="450" y="646" text-anchor="middle">InstitutionalCollateralApp</text>
  <text class="contract-note" x="450" y="664" text-anchor="middle">lock, mint, burn, and release flow</text>

  <rect class="contract" x="105" y="712" width="310" height="58" rx="6"/>
  <text class="contract-title" x="260" y="736" text-anchor="middle">InstitutionalIdentityRegistry</text>
  <text class="contract-note" x="260" y="754" text-anchor="middle">eligibility and credential status</text>

  <rect class="contract" x="485" y="712" width="310" height="58" rx="6"/>
  <text class="contract-title" x="640" y="736" text-anchor="middle">InstitutionalGovernanceTimelock</text>
  <text class="contract-note" x="640" y="754" text-anchor="middle">delayed administrative control</text>

  <!-- Gateway / Proof Contracts -->
  <rect class="group-alt" x="70" y="822" width="760" height="305" rx="8"/>
  <text class="group-title" x="450" y="852" text-anchor="middle">Gateway / Checkpoint / Proof Contracts</text>

  <rect class="contract" x="285" y="887" width="330" height="58" rx="6"/>
  <text class="contract-title" x="450" y="911" text-anchor="middle">InstitutionalCrossChainGateway</text>
  <text class="contract-note" x="450" y="929" text-anchor="middle">commitment and message lifecycle</text>

  <rect class="contract" x="285" y="972" width="330" height="58" rx="6"/>
  <text class="contract-title" x="450" y="996" text-anchor="middle">InstitutionalCheckpointClient</text>
  <text class="contract-note" x="450" y="1014" text-anchor="middle">3-of-4 trusted state roots</text>

  <rect class="contract" x="105" y="1052" width="310" height="58" rx="6"/>
  <text class="contract-title" x="260" y="1076" text-anchor="middle">InstitutionalEVMProofBoundary</text>
  <text class="contract-note" x="260" y="1094" text-anchor="middle">account and storage verification</text>

  <rect class="contract" x="485" y="1052" width="310" height="58" rx="6"/>
  <text class="contract-title" x="640" y="1076" text-anchor="middle">MerklePatriciaProofLib</text>
  <text class="contract-note" x="640" y="1094" text-anchor="middle">MPT and RLP proof primitives</text>

  <!-- Logical dependencies -->
  <path class="edge" d="M398 317 V242 H273 V196"/>
  <text class="edge-label" x="298" y="238">policy checks</text>

  <path class="edge" d="M502 317 V242 H628 V196"/>
  <text class="edge-label" x="570" y="238">valuation</text>

  <path class="assoc" d="M400 383 V410 H260 V430"/>
  <text class="edge-label" x="315" y="405">collateral asset</text>

  <path class="assoc" d="M420 622 V535 H260 V492"/>
  <text class="edge-label" x="292" y="532">mint / burn</text>

  <path class="assoc" d="M480 622 V535 H640 V492"/>
  <text class="edge-label" x="595" y="532">lock / release</text>

  <path class="edge" d="M405 680 V695 H260 V712"/>
  <text class="edge-label" x="300" y="693">identity checks</text>

  <path class="assoc" d="M640 712 V695 H495 V680"/>
  <text class="edge-label" x="570" y="693">administers</text>

  <line class="edge" x1="450" y1="680" x2="450" y2="887"/>
  <text class="edge-label" x="465" y="812">sends / receives</text>

  <line class="edge" x1="450" y1="945" x2="450" y2="972"/>
  <text class="edge-label" x="466" y="964">trusted root</text>

  <path class="edge" d="M420 945 V1038 H260 V1052"/>
  <text class="edge-label" x="290" y="1034">proof validation</text>
  <line class="edge" x1="415" y1="1081" x2="485" y2="1081"/>
  <text class="edge-label" x="450" y="1072" text-anchor="middle">uses</text>
</svg>
